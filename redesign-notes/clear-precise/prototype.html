<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HireSignal · Design proposal</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.55 Arial,sans-serif;color:#242424;background:#eeeeee}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #737373;outline-offset:3px}button{border:1px solid #dedede;background:white;color:inherit;padding:11px 17px;border-radius:6px;transition:background .15s}button:hover{background:#f0f0f0}button[aria-pressed=true],.primary{background:#262626;color:white;border-color:#262626}.toolbar{display:flex;gap:8px;align-items:center;padding:12px 24px;background:#242424;color:white;flex-wrap:wrap}.toolbar strong{margin-right:auto;font-size:13px}.toolbar button{font-size:12px;padding:7px 12px}.note{font-size:12px;color:#616161;margin:14px 24px}iframe{display:block;width:calc(100% - 48px);height:850px;margin:0 auto 24px;border:1px solid #dedede;background:#fafafa;transition:width .2s}iframe.phone{width:390px;max-width:100%;height:844px;border-radius:20px}.shell{background:#fafafa;min-height:100vh}.nav{padding:22px 5%;display:flex;gap:30px;align-items:center;border-bottom:1px solid #dedede;background:#fff}.brand{font-size:22px;letter-spacing:-1px;font-weight:800;margin-right:auto}.brand i{display:inline-block;width:19px;height:22px;margin-right:10px;border-left:6px solid #262626;border-right:6px solid #262626;transform:skewY(-18deg)}.nav span{font-size:13px;color:#616161}.nav .active{color:#262626;font-weight:700}.wrap{max-width:1240px;margin:auto;padding:42px 5%}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:#707070;font-weight:700}h1{font-size:38px;letter-spacing:-1.6px;line-height:1.15;margin:10px 0 12px}h2{font-size:24px;letter-spacing:-.7px;line-height:1.25}h3{font-size:17px;margin:0 0 7px;letter-spacing:-.3px}p{color:#616161;margin:0 0 20px}.header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.sub{font-size:13px;color:#686868}.split{display:grid;grid-template-columns:1fr 1.05fr;border:1px solid #dedede;border-radius:9px;overflow:hidden;background:white}.list{border-right:1px solid #dedede}.row{display:block;width:100%;border:0;border-bottom:1px solid #e5e5e5;border-radius:0;text-align:left;padding:25px;background:white}.row.selected{background:#eeeeee;box-shadow:inset 3px 0 #262626}.line{display:flex;justify-content:space-between;gap:12px}.pill{font-size:11px;color:#3d3d3d;background:#eeeeee;padding:3px 7px;border-radius:3px;white-space:nowrap}.meta{font-size:13px;margin:8px 0;color:#616161}.skills{font-size:12px;color:#494949;margin-top:15px}.detail{padding:32px}.rule{border-top:1px solid #e2e2e2;margin:24px 0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:25px 0}.facts small{display:block;color:#686868;font-size:12px;margin-bottom:4px}.facts strong{font-size:14px}.callout{background:#f2f2f2;padding:15px;font-size:13px;color:#555555;border-left:2px solid #858585}.detail p{font-size:14px}.search{width:100%;border:1px solid #dedede;border-radius:6px;background:white;padding:13px 16px;margin:0 0 22px}summary{cursor:pointer;font-size:13px;padding:12px 0;color:#262626}details p{margin-top:8px}.auth{display:grid;grid-template-columns:1fr 1fr;min-height:720px}.story{padding:80px 12%;background:#eeeeee;display:flex;flex-direction:column;justify-content:center}.story h1{font-size:52px;max-width:430px}.story p{max-width:360px}.steps{margin-top:40px;border-top:1px solid #d4d4d4}.step{display:flex;gap:20px;padding:20px 0;border-bottom:1px solid #d4d4d4}.step b{color:#707070;font-size:12px}.step p{font-size:13px;margin:5px 0 0}.form{max-width:420px;width:100%;margin:auto;padding:45px 25px}.form h1{font-size:30px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0}.roles button{text-align:left;padding:15px 12px}.roles small{display:block;font-size:11px;margin-top:4px}label{display:block;font-size:13px;font-weight:600;margin:18px 0 7px}.field{width:100%;padding:12px;border:1px solid #cccccc;border-radius:5px;background:white}.password{display:flex;gap:6px}.password input{min-width:0}.full{width:100%;margin-top:24px}.back{display:none;margin-bottom:20px}.bottom{display:none}.status{font-size:13px;color:#262626;margin-top:15px}.tabs{display:flex;gap:8px;margin-bottom:20px}.candidate-name{font-size:28px}.sample{font-size:11px;color:#6b6b6b;padding:10px 5%;background:#f1f1f1} @media(max-width:650px){.nav{padding:17px 20px}.nav span{display:none}.brand{font-size:21px}.wrap{padding:26px 18px 90px}h1{font-size:30px}.header{display:block}.header button{margin-top:12px}.split{display:block}.list{border:0}.detail{display:none;padding:22px}.split.show-detail .list{display:none}.split.show-detail .detail{display:block}.back{display:block}.row{padding:22px 18px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:white;border-top:1px solid #dedede;padding:15px;font-size:12px}.auth{display:block;min-height:0}.story{display:none}.form{padding:35px 24px 60px}.form h1{font-size:30px}.toolbar{padding:12px}.note{margin:12px}iframe{width:100%}.detail h2{font-size:22px}.sample{font-size:10px}}
</style><body><script>
const q=new URLSearchParams(location.search), screen=q.get('screen');
if(!screen){document.body.innerHTML=`<div class="toolbar"><strong>HIRESIGNAL / DESIGN REVIEW 01</strong><button data-page="auth">Authentication</button><button data-page="jobs">Job discovery</button><button data-page="review">Applicant review</button><button id="size">Phone preview</button></div><p class="note">Interactive design proposal · fictional sample data · no account or hiring actions are submitted. Select a row, change registration intent, or expand score details.</p><iframe title="HireSignal proposed screen" src="?screen=auth"></iframe>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelector('iframe').src='?screen='+b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.setAttribute('aria-pressed',x===b))});document.querySelector('[data-page]').setAttribute('aria-pressed','true');document.querySelector('#size').onclick=e=>{const phone=document.querySelector('iframe').classList.toggle('phone');e.target.textContent=phone?'Desktop preview':'Phone preview'};}
else{const nav=`<header class="nav"><div class="brand"><i></i>HireSignal</div>${screen==='auth'?'<span>A clearer next step.</span>':screen==='jobs'?'<span class="active">Find jobs</span><span>Applications</span><span>My resume</span><span>Account</span>':'<span>Roles</span><span class="active">Applicants</span><span>Analytics</span><span>Account</span>'}</header>`;document.body.innerHTML='<div class="shell">'+nav+'<main id="main"></main><div class="sample">Design sample · Fictional records. Navigation labels illustrate the proposed structure.</div></div>';const main=document.querySelector('#main');
if(screen==='auth'){main.innerHTML=`<div class="auth"><section class="story"><div class="eyebrow">Make your next move</div><h1>Good work starts<br>with a clear view.</h1><p>Understand the role. Show what you bring. Keep track of what happens next.</p><div class="steps"><div class="step"><b>01</b><div><h3>Find the right starting point</h3><p>See requirements before you apply.</p></div></div><div class="step"><b>02</b><div><h3>Bring your experience into focus</h3><p>Build your profile from your resume.</p></div></div><div class="step"><b>03</b><div><h3>Know where you stand</h3><p>Keep your applications in one place.</p></div></div></div></section><section class="form"><div class="eyebrow">Your next chapter</div><h1>Create your account</h1><p id="intro">Find opportunities and follow your applications.</p><div class="roles"><button aria-pressed="true" data-role="candidate">Find a job<small>For job seekers</small></button><button aria-pressed="false" data-role="recruiter">Hire people<small>For hiring teams</small></button></div><form><label for="name">Full name</label><input class="field" id="name" autocomplete="name" required placeholder="Your full name"><label for="email">Email address</label><input class="field" id="email" autocomplete="email" type="email" required placeholder="you@example.com"><label for="password">Password</label><div class="password"><input class="field" id="password" autocomplete="new-password" type="password" required placeholder="Create a password"><button type="button" id="show">Show</button></div><button class="primary full">Preview next step →</button></form><p class="status" aria-live="polite" id="message"></p><p class="sub">This is a form interaction preview. No account is created.</p></section></div>`;document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelector('#intro').textContent=b.dataset.role==='candidate'?'Find opportunities and follow your applications.':'Post roles and review candidates with context.'});document.querySelector('#show').onclick=e=>{const p=document.querySelector('#password');p.type=p.type==='password'?'text':'password';e.target.textContent=p.type==='password'?'Show':'Hide'};document.querySelector('form').onsubmit=e=>{e.preventDefault();document.querySelector('#message').textContent='Your details are ready. The next step would verify your email.'};}
else{const isJob=screen==='jobs';const data=isJob?[['Frontend developer','React · JavaScript · CSS','1+ years','Bachelor’s degree'],['Graduate software engineer','JavaScript · Git · SQL','No experience required','Any education level'],['Product designer','Figma · Prototyping · Research','2+ years','Any education level']]:[['Amara Okafor','React · JavaScript · CSS','2 years experience','Bachelor’s degree'],['Tomi Adebayo','React · TypeScript · Git','3 years experience','Bachelor’s degree'],['Daniel Mensah','JavaScript · CSS · SQL','1 year experience','Bachelor’s degree']];main.innerHTML=`<div class="wrap"><div class="header"><div><div class="eyebrow">${isJob?'Your next opportunity':'Roles / Frontend developer'}</div><h1>${isJob?'Find work that fits.':'Review with context.'}</h1><p>${isJob?'Start with the requirements. Explore the details when a role feels right.':'Compare requirements, then take a closer look at the evidence.'}</p></div><span class="sub">3 sample ${isJob?'roles':'candidates'}</span></div>${isJob?'<input class="search" aria-label="Search sample roles" placeholder="Search role or skill">':'<div class="callout" style="margin-bottom:22px">Matching supports your review. A score describes alignment with these requirements, not a hiring decision.</div>'}<div class="split"><section class="list" aria-label="${isJob?'Jobs':'Candidates'}">${data.map((d,i)=>`<button class="row ${i===0?'selected':''}" data-index="${i}"><div class="line"><h3>${d[0]}</h3><span class="pill">${isJob?'Open':'To review'}</span></div><div class="meta">${d[2]} · ${d[3]}</div><div class="skills">${d[1]}</div><div class="sub" style="margin-top:14px">${isJob?'View requirements →':'View match evidence →'}</div></button>`).join('')}<p id="empty" hidden style="padding:20px">No sample roles match that search.</p></section><section class="detail" aria-label="Selected details"></section></div></div><div class="bottom"><span>${isJob?'Find jobs':'Roles'}</span><span>${isJob?'Applications':'Applicants'}</span><span>${isJob?'My resume':'Account'}</span></div>`;function select(i,open){const d=data[i];document.querySelectorAll('.row').forEach((r,n)=>{r.classList.toggle('selected',n===i);r.setAttribute('aria-pressed',n===i)});document.querySelector('.detail').innerHTML=`<button class="back">← Back to ${isJob?'jobs':'candidates'}</button><div class="eyebrow">${isJob?'Role overview':'Candidate overview'}</div><h2 class="candidate-name">${d[0]}</h2><p>${isJob?'Build useful, accessible interfaces with a small product team.':d[2]+' · '+d[3]}</p>${isJob?`<div class="callout">Company, location and salary are not provided for this sample role.</div><div class="facts"><div><small>Experience</small><strong>${d[2]}</strong></div><div><small>Education</small><strong>${d[3]}</strong></div></div><div class="rule"></div><h3>What you’ll need</h3><p>${d[1]}</p><h3>About the work</h3><p>Work with the team to deliver dependable interfaces, review changes, and make the product easier to use.</p><details><summary>Read the full description</summary><p>This fictional description demonstrates the expanded reading state. Production will display the complete employer-provided description.</p></details><button class="primary action">Review application →</button>`:`<div class="facts"><div><small>Required skills found</small><strong>${i===0?'React, JavaScript, CSS':i===1?'React':'JavaScript, CSS'}</strong></div><div><small>Not found in profile</small><strong>${i===0?'None of the required skills':i===1?'JavaScript, CSS':'React'}</strong></div></div><div class="rule"></div><h3>What supports this match</h3><p>The profile lists ${d[1].replaceAll(' · ', ', ')}. The stated experience meets the role’s one-year requirement.</p><p class="sub">Extracted profile information may be incomplete. Review the resume before deciding.</p><details><summary>View score breakdown and explanation</summary><p>Illustrative score: ${[86,79,72][i]}%. Production will display the stored skills, experience, education and semantic scores with the returned explanation.</p></details><div class="rule"></div><button class="primary action">Add to shortlist</button>`}<p class="status" aria-live="polite"></p>`;document.querySelector('.back').onclick=()=>document.querySelector('.split').classList.remove('show-detail');document.querySelector('.action').onclick=()=>document.querySelector('.status').textContent=isJob?'Preview: choose your resume and confirm before submitting. No application has been sent.':'Preview: candidate added to shortlist locally. No hiring record has changed.';if(open)document.querySelector('.split').classList.add('show-detail');}select(0,false);document.querySelectorAll('.row').forEach(b=>b.onclick=()=>select(+b.dataset.index,true));if(isJob)document.querySelector('.search').oninput=e=>{let count=0;document.querySelectorAll('.row').forEach(r=>{r.hidden=!r.textContent.toLowerCase().includes(e.target.value.toLowerCase());if(!r.hidden)count++});document.querySelector('#empty').hidden=count>0};}}
</script></body></html>
